<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grey Zone Intel Memo</title>
<style>
  html, body { margin: 0; background: #F4F1EA; min-height: 100vh; }
</style>
</head>
<body>
<script>
// Home always shows the most recently published report. The manifest is the
// single source of truth for "latest" — publishing a new report only means
// adding an entry to /reports/manifest.json, nothing here needs to change.
fetch('/reports/manifest.json')
  .then(function (r) { return r.json(); })
  .then(function (list) {
    if (!list || !list.length) throw new Error('empty manifest');
    var latest = list.slice().sort(function (a, b) {
      return new Date(b.publishedAt) - new Date(a.publishedAt);
    })[0];
    return fetch('/reports/' + latest.slug + '.html');
  })
  .then(function (r) {
    if (!r.ok) throw new Error('report fetch failed: ' + r.status);
    return r.text();
  })
  .then(function (html) {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function (err) {
    console.error(err);
    document.body.innerHTML =
      '<div style="font-family:IBM Plex Sans,Helvetica Neue,Arial,sans-serif;max-width:520px;margin:15vh auto;padding:0 24px;color:#14161A;text-align:center;">' +
      '<h1 style="font-family:Newsreader,Georgia,serif;font-size:24px;">Unable to load the latest report</h1>' +
      '<p style="color:#5B6068;">Try the <a href="/archive.html" style="color:#1B2A3B;">archive</a> instead.</p>' +
      '</div>';
  });
</script>
</body>
</html>
